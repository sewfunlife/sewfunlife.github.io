<title>樂樂手創屋｜Happy House</title>
<meta name="description" content="樂樂手創屋｜手作、植物與生活風格的社群與聯絡入口。">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#2f3d32;--ink-soft:rgba(47,61,50,.68);--ease:cubic-bezier(.23,1,.32,1);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-synthesis:none}
*{box-sizing:border-box}html{min-width:320px;background:#d4e5c8}
body{margin:0;min-width:320px;min-height:100svh;color:var(--ink);position:relative;overflow-x:hidden;isolation:isolate;background:linear-gradient(180deg,#c5dcc0 0%,#d3e5cb 22%,#e2edcf 48%,#d5e4bc 72%,#b8cfa0 100%)}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}:focus-visible{outline:3px solid rgba(90,130,85,.6);outline-offset:4px}
.scene{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none;height:100dvh}
.mist{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 30%,rgba(255,255,255,.25) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(255,255,255,.18) 0%,transparent 45%)}
.clouds{position:absolute;inset:0 0 auto;width:100%;height:48%}.cloud{position:absolute;background:rgba(255,255,255,.82);border-radius:100px;filter:drop-shadow(0 4px 14px rgba(255,255,255,.35))}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.c1{width:96px;height:33px;top:8%;left:-125px;animation:drift 62s linear infinite;opacity:.72}.c1:before{width:42px;height:42px;top:-22px;left:12px}.c1:after{width:50px;height:35px;top:-13px;right:12px}
.c2{width:130px;height:40px;top:18%;left:-170px;animation:drift 80s linear infinite -28s;opacity:.65}.c2:before{width:56px;height:56px;top:-28px;left:20px}.c2:after{width:64px;height:40px;top:-16px;right:16px}
.c3{width:80px;height:28px;top:5%;left:-100px;animation:drift 68s linear infinite -40s;opacity:.58}.c3:before{width:34px;height:34px;top:-16px;left:10px}.c3:after{width:42px;height:28px;top:-10px;right:10px}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 280px))}}
.leaf{position:absolute;width:14px;height:8px;border-radius:100% 0 100% 0;background:rgba(110,150,85,.45);transform-origin:center;animation:leafFloat 14s ease-in-out infinite}.l1{top:28%;left:12%;transform:rotate(-30deg)}.l2{top:36%;left:78%;width:12px;height:7px;background:rgba(140,170,95,.4);animation-delay:-4s;animation-duration:16s}.l3{top:22%;left:55%;width:11px;height:6px;background:rgba(95,140,80,.38);animation-delay:-8s;animation-duration:13s}
@keyframes leafFloat{0%,100%{transform:translateY(0) rotate(-28deg);opacity:.5}50%{transform:translateY(18px) rotate(12deg);opacity:.75}}
.forest{position:absolute;bottom:0;left:0;width:100%;height:32%}.tree-line{position:absolute;bottom:18%;left:-5%;width:110%;height:55%;background:radial-gradient(ellipse 40px 70px at 8% 100%,#7a9e68 0%,transparent 70%),radial-gradient(ellipse 50px 85px at 18% 100%,#6d925c 0%,transparent 70%),radial-gradient(ellipse 45px 75px at 30% 100%,#7fa870 0%,transparent 70%),radial-gradient(ellipse 55px 90px at 45% 100%,#6a8f58 0%,transparent 70%),radial-gradient(ellipse 48px 80px at 58% 100%,#789e65 0%,transparent 70%),radial-gradient(ellipse 52px 88px at 72% 100%,#6e945c 0%,transparent 70%),radial-gradient(ellipse 44px 72px at 85% 100%,#82ab72 0%,transparent 70%),radial-gradient(ellipse 48px 78px at 95% 100%,#71985f 0%,transparent 70%);opacity:.55}
.hill{position:absolute;bottom:0;width:150%;border-radius:50% 50% 0 0}.hill.back{height:85%;left:-25%;background:linear-gradient(180deg,#8fb87a 0%,#6fa05e 100%);opacity:.9}.hill.front{height:52%;left:-12%;background:linear-gradient(180deg,#a8c98f 0%,#87b572 100%);z-index:1}
.flower{position:absolute;bottom:12%;width:9px;height:9px;z-index:2;border-radius:50%;background:#fffef5;box-shadow:3px 0 0 -1px #fffef5,-3px 0 0 -1px #fffef5,0 3px 0 -1px #fffef5,0 -3px 0 -1px #fffef5;transform-origin:center bottom;animation:sway 5.5s ease-in-out infinite}.flower:before{content:"";position:absolute;inset:2px;border-radius:50%;background:#e8c96a}.flower:after{content:"";position:absolute;bottom:-11px;left:50%;width:1.5px;height:11px;background:#5a9a58;transform:translateX(-50%);border-radius:1px}.f1{left:8%}.f2{left:22%;bottom:16%;animation-delay:-1.2s}.f3{left:38%;animation-delay:-.6s}.f4{left:54%;bottom:14%;animation-delay:-2.1s}.f5{left:70%;animation-delay:-.9s}.f6{left:86%;bottom:11%;animation-delay:-1.7s}@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.page{position:relative;z-index:2;width:min(100% - 32px,420px);margin:0 auto;padding:40px 0 36px}.brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:28px;opacity:0;animation:fadeUp .75s var(--ease) forwards}.avatar{width:86px;height:86px;margin-bottom:14px;border-radius:50%;background:#fffdf6;border:1px solid rgba(120,150,100,.28);box-shadow:0 6px 20px rgba(90,120,70,.1);display:grid;place-items:center}.avatar svg{width:72px;height:72px;display:block}.brand h1{margin:0;font-size:24px;font-weight:600;letter-spacing:.04em;color:#2a3a2e;line-height:1.35}.brand-en{margin:5px 0 0;font-size:13px;font-weight:400;color:var(--ink-soft);letter-spacing:.06em}
.list{display:grid;gap:11px}.btn{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;min-height:58px;padding:12px 18px 12px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(70,100,60,.08),0 1px 3px rgba(70,100,60,.04);transition:transform .2s var(--ease),box-shadow .2s var(--ease),filter .2s var(--ease);opacity:0;animation:fadeUp .6s var(--ease) forwards}.btn:nth-child(1){animation-delay:.12s}.btn:nth-child(2){animation-delay:.2s}.btn:nth-child(3){animation-delay:.28s}.btn:nth-child(4){animation-delay:.36s}.btn:nth-child(5){animation-delay:.44s}.btn .icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.75)}.btn .icon svg{width:18px;height:18px;display:block}.brand-icon{fill:currentColor}.site-icon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.label{font-size:16px;font-weight:600;letter-spacing:.02em}.arr{font-size:18px;opacity:.55;transition:transform .2s var(--ease)}
.ig{background:linear-gradient(135deg,#f3e0dc,#edd4cf);color:#7a4e48}.ig .icon{color:#c4786e}.threads{background:linear-gradient(135deg,#e8e4d8,#ddd8ca);color:#4a4a3e}.threads .icon{color:#6a6a5a}.fb{background:linear-gradient(135deg,#dce6ef,#cfdceb);color:#3d5a75}.fb .icon{color:#5b7fa3}.web{background:linear-gradient(135deg,#e0ebcf,#d2e0bc);color:#3f5c38}.web .icon{color:#6a8f5c}.line{background:linear-gradient(135deg,#d8edc8,#c8e3b4);color:#2f5c32}.line .icon{color:#4e9a52}.btn.is-empty{opacity:.55!important;pointer-events:none;filter:grayscale(.15);animation:none!important}
@media(hover:hover) and (pointer:fine){.btn:not(.is-empty):hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(70,100,60,.12),0 2px 6px rgba(70,100,60,.06);filter:brightness(1.03)}.btn:not(.is-empty):hover .arr{transform:translateX(3px)}}
.footer{margin-top:36px;padding-top:18px;border-top:1px solid rgba(80,120,70,.18);text-align:center;opacity:0;animation:fadeUp .7s var(--ease) .55s forwards}.footer p{margin:0;font-size:12px;color:rgba(47,61,50,.62);letter-spacing:.03em}@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:620px){.page{padding:28px 0;width:min(100% - 28px,420px)}.brand{margin-bottom:22px}.avatar{width:80px;height:80px}.avatar svg{width:66px;height:66px}.brand h1{font-size:22px}.btn{min-height:54px;padding:11px 16px 11px 12px;gap:10px}.btn .icon{width:34px;height:34px}.label{font-size:15px}.forest{height:26%}}
@media(prefers-reduced-motion:reduce){.cloud,.leaf,.flower,.brand,.btn,.footer{animation:none!important;opacity:1!important;transform:none!important}.btn.is-empty{opacity:.55!important}.c1{left:10%;top:10%}.c2{left:55%;top:16%}.c3{left:30%;top:6%}}
</style>
</head>

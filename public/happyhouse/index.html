:root{--ink:#314038;--soft:#718078;--ease:cubic-bezier(.23,1,.32,1);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;min-width:320px;min-height:100%;background:#cbd9c7}body{min-height:100svh;color:var(--ink);overflow-x:hidden;isolation:isolate}a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 50% 32%,rgba(255,255,239,.92) 0%,rgba(241,246,224,.74) 26%,rgba(218,233,208,.52) 48%,rgba(190,212,189,.54) 72%,rgba(159,188,164,.68) 100%),linear-gradient(180deg,#aec6b0 0%,#d7e3cc 50%,#a7c0aa 100%)}
.scene:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 7%,rgba(75,103,79,.07) 7.5% 9%,transparent 9.5% 16%);mask-image:linear-gradient(to bottom,rgba(0,0,0,.75),rgba(0,0,0,.18) 72%,transparent);-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.75),rgba(0,0,0,.18) 72%,transparent)}
.scene:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,rgba(255,255,244,.5),transparent 46%)}
.trunk{position:absolute;top:-4%;bottom:-5%;width:44px;border-radius:45% 55% 35% 65%;background:linear-gradient(90deg,rgba(54,80,59,.06),rgba(66,93,69,.19),rgba(48,72,53,.09));filter:blur(.2px)}.trunk.t1{left:4%}.trunk.t2{left:15%;width:24px;opacity:.48}.trunk.t3{right:5%;width:50px}.trunk.t4{right:17%;width:22px;opacity:.45}
.edge-svg{position:absolute;overflow:visible}.branch-left{left:-26px;top:-6px;width:min(58vw,430px);height:min(31vh,250px);transform-origin:0 50%;animation:swayL 10s ease-in-out infinite}.branch-right{right:-26px;top:4px;width:min(58vw,430px);height:min(31vh,250px);transform:scaleX(-1);transform-origin:100% 50%;animation:swayR 11s ease-in-out infinite -2s}
.fern-left{left:-28px;bottom:-20px;width:min(54vw,360px);height:min(39vh,350px);transform-origin:12% 100%;animation:swayL 9s ease-in-out infinite}.fern-right{right:-28px;bottom:-20px;width:min(54vw,360px);height:min(39vh,350px);transform:scaleX(-1);transform-origin:88% 100%;animation:swayR 9.5s ease-in-out infinite -3s}
.broad-left{left:-36px;bottom:3%;width:min(34vw,230px);height:min(24vh,210px);transform-origin:0 100%;animation:swayL 11s ease-in-out infinite -1s}.broad-right{right:-36px;bottom:2%;width:min(34vw,230px);height:min(24vh,210px);transform:scaleX(-1);transform-origin:100% 100%;animation:swayR 12s ease-in-out infinite -4s}
.float-leaf{position:absolute;width:18px;height:10px;border-radius:95% 5% 95% 5%;background:rgba(74,112,74,.35);animation:floatLeaf 13s ease-in-out infinite}.fl1{left:12%;top:39%;transform:rotate(-28deg)}.fl2{right:12%;top:53%;transform:rotate(24deg);animation-delay:-4s}.fl3{left:29%;top:68%;transform:rotate(12deg);animation-delay:-8s;opacity:.55}
@keyframes swayL{50%{transform:rotate(1.7deg)}}@keyframes swayR{50%{transform:scaleX(-1) rotate(1.5deg)}}@keyframes floatLeaf{0%,100%{translate:0 0;rotate:-5deg;opacity:.25}50%{translate:12px 22px;rotate:22deg;opacity:.5}}
.page{position:relative;z-index:5;width:min(calc(100% - 30px),420px);margin:auto;padding:28px 0 26px}.brand{text-align:center;margin-bottom:20px;animation:up .7s var(--ease) both}.avatar{width:80px;height:80px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:rgba(255,253,244,.91);border:1px solid rgba(87,115,76,.18);box-shadow:0 8px 26px rgba(53,79,48,.10)}.avatar svg{width:66px;height:66px}.brand h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.05em}.brand p{margin:4px 0 0;font-size:12px;color:var(--soft);letter-spacing:.08em}.links{display:grid;gap:11px}.btn{min-height:54px;display:grid;grid-template-columns:38px 1fr 18px;align-items:center;gap:11px;padding:10px 16px 10px 11px;border-radius:999px;box-shadow:0 4px 16px rgba(54,79,49,.07);animation:up .58s var(--ease) both;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:.2s var(--ease)}.btn:nth-child(1){animation-delay:.1s}.btn:nth-child(2){animation-delay:.17s}.btn:nth-child(3){animation-delay:.24s}.btn:nth-child(4){animation-delay:.31s}.btn:nth-child(5){animation-delay:.38s}.ico{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.72);font-weight:700}.ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.label{font-size:15px;font-weight:600;letter-spacing:.02em}.arr{font-size:19px;opacity:.46}.ig{background:linear-gradient(135deg,rgba(240,223,220,.92),rgba(234,211,207,.9));color:#75504b}.threads{background:linear-gradient(135deg,rgba(232,229,219,.92),rgba(220,216,205,.9));color:#4e5148}.fb{background:linear-gradient(135deg,rgba(220,230,237,.92),rgba(207,218,228,.9));color:#405d73}.web{background:linear-gradient(135deg,rgba(226,234,216,.85),rgba(213,225,201,.82));color:#486247}.line{background:linear-gradient(135deg,rgba(216,233,204,.85),rgba(204,225,191,.82));color:#3d6540}.disabled{opacity:.48!important;pointer-events:none;filter:grayscale(.12);animation:none}.footer{margin-top:29px;padding-top:16px;border-top:1px solid rgba(68,98,60,.14);text-align:center;animation:up .65s var(--ease) .48s both}.footer p{margin:0;font-size:11px;color:rgba(48,65,55,.56);letter-spacing:.035em}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(hover:hover) and (pointer:fine){.btn:not(.disabled):hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(54,79,49,.12)}}@media(min-width:800px){.page{padding-top:38px}.branch-left,.branch-right{width:min(36vw,500px);height:300px}.fern-left,.fern-right{width:min(32vw,410px);height:390px}.broad-left,.broad-right{width:min(22vw,260px);height:230px}}@media(prefers-reduced-motion:reduce){.edge-svg,.float-leaf,.brand,.btn,.footer{animation:none!important;transform:none!important;opacity:1}.branch-right,.fern-right,.broad-right{transform:scaleX(-1)!important}.disabled{opacity:.48!important}}
</style>
